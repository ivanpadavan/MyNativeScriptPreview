name: Preview CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NS_CLI_NO_ANALYTICS: '1'
  BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile

jobs:
  integration:
    name: iOS integration and source checks
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require committed dependency locks
        run: |
          test -f package-lock.json
          test -f Gemfile.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Build the GPU text package
        run: npm run example:build
      - name: Check sources and example types
        run: |
          npm run ci:source
          npx tsc --noEmit --project ci/tsconfig.examples.json
          ruby -c tools/add-ui-tests.rb
          python3 -m py_compile tools/check-no-embedded-example.py tools/verify-ipa.py
          for script in tools/*.sh; do bash -n "$script"; done
      - name: Prepare iOS and capture pod lock
        run: bash tools/prepare-ios.sh
      - name: Configure native UI integration tests
        run: bundle exec ruby tools/add-ui-tests.rb
      - name: Run real-paste integration scenarios
        run: bash tools/run-integration.sh
      - name: Verify the example is not embedded in the simulator shell
        run: python3 tools/check-no-embedded-example.py artifacts/simulator-app
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence-${{ github.sha }}
          path: |
            artifacts/integration.xcresult/
            artifacts/*.log
            dist/gpu-check.preview.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Stage dependency lock evidence
        if: always()
        run: |
          mkdir -p artifacts/pod-lock
          if [ -f platforms/ios/Podfile.lock ]; then cp platforms/ios/Podfile.lock artifacts/pod-lock/Podfile.lock; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-pod-lock
          path: artifacts/pod-lock/
          if-no-files-found: ignore

  device:
    name: Unsigned arm64 device IPA
    needs: integration
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Use the integration job's exact pod resolution
        uses: actions/download-artifact@v4
        with:
          name: ios-pod-lock
          path: artifacts/pod-lock
      - name: Build example and prepare iOS
        run: |
          npm run example:build
          bash tools/prepare-ios.sh
      - name: Build unsigned device IPA
        run: bash tools/build-unsigned.sh
      - name: Verify device artifact and export capability report
        run: |
          npm run ci:verify-ipa
          node tools/capability-report.mjs
      - name: Require committed CocoaPods lock
        run: |
          if [ ! -f ci/Podfile.lock ]; then
            echo 'Commit ios-pod-lock/Podfile.lock as ci/Podfile.lock and rerun. First pod resolution is not a release.' >&2
            exit 1
          fi
      - name: Publish successful artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-unsigned-${{ github.sha }}
          path: |
            artifacts/MyNativeScriptPreview-unsigned.ipa
            artifacts/requested-entitlements.plist
            artifacts/capabilities.json
            dist/gpu-check.preview.txt
            ci/signing.md
          if-no-files-found: error
          retention-days: 30
      - name: Write usage instructions
        run: |
          echo '## Preview ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sign and install the unsigned IPA separately with your own profile.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open gpu-check.preview.txt, copy the entire text, paste in the shell, tap Запустить, then Проверить GPU.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The simulator run checks the real API bridge; it does not prove physical background GPU execution or Personal Team signing.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload device diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-diagnostics-${{ github.sha }}
          path: artifacts/*.log
          if-no-files-found: ignore
